# onthesignal.toml
[ai]
provider = "anthropic"          # "anthropic" (Claude), "openai" (ChatGPT) or "ollama" (local)
model = "claude-sonnet-5-5"       # mandatory for openai and ollama
base_url = ""                # e.g. http://localhost:11434 for a remote Ollama
auto_execute = "read_only"   # "read_only": analyses run without asking; "none": always ask
send_raw_data = false
